<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14626a">
<title>مقرأة آمنة الإلكترونية – إدارة المهام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* ضعي ملفات خط ثمانية في مجلد fonts بجانب الملف ليُستخدم تلقائيًا */
@font-face{font-family:'Thmanyah';src:local('Thmanyah Sans'),url('fonts/thmanyahsans-Regular.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Thmanyah';src:local('Thmanyah Sans Bold'),url('fonts/thmanyahsans-Bold.woff2') format('woff2');font-weight:700}
:root{--teal:#14626a;--teal2:#0e4a50;--sand:#d8bc8a;--sand2:#f3ead9;--bg:#fbfaf7;--card:#fff;--ink:#17333a;--mut:#6b7f83;--line:#e6e0d2;--ok:#2e8b57;--warn:#c98a1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e21;--card:#162a2e;--ink:#eef2f1;--mut:#9db0b3;--line:#27403f;--sand2:#2a3a35}}
:root[data-theme="dark"]{--bg:#0f1e21;--card:#162a2e;--ink:#eef2f1;--mut:#9db0b3;--line:#27403f;--sand2:#2a3a35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Thmanyah','Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:14px}
.login img{width:200px;height:200px;object-fit:contain}
.login h1{margin:4px 0 0;font-size:26px;color:var(--teal)}
.login p{margin:0;color:var(--mut)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--teal);color:#fff}
.btn.sand{background:var(--sand);color:#2b2414}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.who button{flex:1 1 30%;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.top{background:var(--teal);color:#fff;padding:14px 18px 22px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;border-radius:12px;background:#fff;object-fit:contain;padding:4px}
.top h2{margin:0;font-size:18px;line-height:1.3}.top small{opacity:.85}
.top .sp{flex:1}
.top .ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:17px}
.prog{margin-top:14px;background:rgba(255,255,255,.18);border-radius:99px;height:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sand);border-radius:99px;transition:width .4s}
.prog-t{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.95}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.tabs button{white-space:nowrap;padding:8px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:500}
.tabs button.on{background:var(--sand);border-color:var(--sand);color:#2b2414;font-weight:700}
.list{padding:8px 16px;display:grid;gap:10px}
.task{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--sand);border-radius:16px;padding:14px;text-align:start;width:100%;display:block}
.task.doing{border-inline-start-color:var(--warn)}.task.done{border-inline-start-color:var(--ok)}
.task h3{margin:0 0 4px;font-size:16px}.task.done h3{text-decoration:line-through;opacity:.6}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);align-items:center}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sand2);color:var(--ink)}
.pill.doing{background:#f7e6c2;color:#7a5200}.pill.done{background:#d5efdf;color:#1c5a37}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav div{max-width:520px;width:100%;display:flex}
.nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button b{font-size:20px;font-weight:400}.nav button.on{color:var(--teal);font-weight:700}
.dot{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);background:#c0392b;color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 244px));width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(20,98,106,.4);z-index:7}
.sheet-bg{position:fixed;inset:0;background:rgba(10,30,33,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.prog i{transition:none}}
.sheet h3{margin:0 0 4px;font-size:20px;color:var(--teal)}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hint{font-size:13px;color:var(--mut);background:var(--sand2);padding:8px 12px;border-radius:10px;margin-top:8px}
.al{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.al.new{border-color:var(--sand);background:var(--sand2)}.al small{color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--teal)}.stat span{font-size:12px;color:var(--mut)}
h4{margin:10px 16px 4px;font-size:16px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:40;font-size:14px}
.fm{width:100%;text-align:start}.fm .btn{margin-top:14px}.login.st{justify-content:flex-start;padding-top:24px}
.err,.ok{font-size:14px;margin-top:10px;padding:0}.err{color:#b3261e}.ok{color:var(--ok)}.err:empty,.ok:empty{display:none}
.hh{font-size:12px;color:var(--mut);margin-top:4px}.link{display:block;margin:12px auto 0;color:var(--teal);font-weight:700;padding:6px;text-decoration:underline}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:6px}
.outb{color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:6px 10px}
.nav button b{display:flex}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login img{background:#fbfaf7;border-radius:24px;padding:14px}}
.pw{position:relative}.pw input{padding-right:46px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.rq{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.rq span{font-weight:700;min-width:100%}.rq select{width:auto;flex:1;padding:7px}.rq .pill{padding:7px 14px;border:1px solid var(--line);color:var(--ink)}
.acts{margin-top:6px}.acts .link{display:inline-block;margin:6px 0 0 14px;font-size:14px}
.chk{margin:10px 0 0}
.pen{display:inline-flex;vertical-align:middle;color:#fff;opacity:.85;margin-inline-start:6px;padding:3px}
.prog2{height:8px;background:var(--sand2);border-radius:99px;overflow:hidden;margin-top:6px}.prog2 i{display:block;height:100%;background:var(--teal);border-radius:99px}
.rw{padding:9px 0;border-top:1px solid var(--line)}.rw:first-child{border-top:0}.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rt span{color:var(--mut);font-size:13px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl label{margin:0 0 4px;font-size:13px}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bd .pill{background:var(--sand2)}
.ptitle{display:none;text-align:center;padding:10px}
@media print{.nav,.top,.fab,.tabs,.fl,.link,.btn,.toast{display:none!important}.ptitle{display:block}body{background:#fff}}
.task.late{border-inline-start-color:#c0392b;background:rgba(192,57,43,.07)}.pill.late{background:#f6d5d1;color:#8a1f13}
.sheet{position:relative}.x{position:absolute;top:10px;left:12px;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;color:var(--mut);background:var(--sand2)}
html,body{overscroll-behavior-y:contain}
.ptr{position:fixed;top:env(safe-area-inset-top,0px);left:50%;margin-left:-75px;width:150px;text-align:center;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;z-index:30;pointer-events:none}
.swb{display:block;margin-top:4px;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
.att{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;color:var(--teal);word-break:break-all}.att img{max-width:100%;border-radius:8px;display:block}
label.fileb{display:block;text-align:center;padding:12px;border:1.5px dashed var(--line);border-radius:12px;margin-top:8px;cursor:pointer;font-weight:500}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px}.cg .h{text-align:center;font-size:12px;color:var(--mut)}
.cc{aspect-ratio:1/1.05;border-radius:12px;border:1px solid var(--line);background:var(--card);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.cc small{font-weight:400;color:var(--mut);font-size:10px}.cc.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}.cc.td{background:var(--sand2)}
.dts{display:flex;gap:3px;position:absolute;bottom:4px}.dts i{width:6px;height:6px;border-radius:50%}.dts .t{background:var(--teal)}.dts .e{background:#b8892f}.dts .a{background:#c0392b}
[data-a="addC"],[data-a="addW"],[data-a="delU"],[data-a="delN"]{display:none!important}
</style>
</head>

const d=e.querySelector('#dl');if(d)d.onclick=()=>ask('حذف هذه المحطة؟',async()=>done('تم الحذف',await DB.from('events').delete().eq('id',id)))}

/* ---------- start ---------- */
(async function boot(){
try{const {data}=await DB.from('departments').select('id,name');(data||[]).forEach(d=>{DN[d.id]=d.name;DI[d.name]=d.id});
const {data:{session}}=await DB.auth.getSession();if(session){const r=await enter0(session.user.id);if(r)S.auth='login'}}catch(e){}
S.boot=0;render();
DB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recover();if(ev==='SIGNED_OUT'&&S.user){S.user=null;render()}});
setInterval(()=>{if(S.user&&!document.querySelector('.sheet-bg'))pull().then(ok=>ok&&render())},60000)})();
</script>
</body>
</html>
